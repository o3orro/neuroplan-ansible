---
- name: Compare Jenkins job configuration
  hosts: devops_nodes
  become: false
  gather_facts: false

  tasks:
    - name: Get current Jenkins job config
      ansible.builtin.uri:
        url: "{{ jenkins_api_url }}/job/{{ jenkins_job_name }}/config.xml"
        method: GET
        url_username: "{{ jenkins_admin_user }}"
        url_password: "{{ jenkins_api_token }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: current_job_config
      no_log: true
      check_mode: false
      changed_when: false

    - name: Render desired Jenkins job config
      ansible.builtin.set_fact:
        desired_job_config: >-
          {{
            lookup(
              'ansible.builtin.template',
              playbook_dir ~ '/../roles/jenkins/templates/neuroplan-ci.xml.j2'
            )
          }}
      no_log: true

    - name: Save current Jenkins config for comparison
      ansible.builtin.copy:
        content: "{{ current_job_config.content }}"
        dest: /tmp/neuroplan-current-raw.xml
        mode: "0600"
      changed_when: false

    - name: Save desired Jenkins config for comparison
      ansible.builtin.copy:
        content: "{{ desired_job_config }}"
        dest: /tmp/neuroplan-desired-raw.xml
        mode: "0600"
      changed_when: false

    - name: Normalize Jenkins XML configurations
      ansible.builtin.shell: |
        python3 - "{{ item.src }}" "{{ item.dest }}" <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        src = sys.argv[1]
        dst = sys.argv[2]

        tree = ET.parse(src)
        root = tree.getroot()

        for elem in root.iter():
            # Jenkins가 자동으로 붙이는 plugin 버전 제거
            if "plugin" in elem.attrib:
                elem.attrib["plugin"] = elem.attrib["plugin"].split("@", 1)[0]

            # 들여쓰기용 공백 제거
            if elem.text is not None and not elem.text.strip():
                elem.text = None

            if elem.tail is not None and not elem.tail.strip():
                elem.tail = None

        tree.write(
            dst,
            encoding="unicode",
            xml_declaration=False,
            short_empty_elements=True
        )
        PY
      loop:
        - src: /tmp/neuroplan-current-raw.xml
          dest: /tmp/neuroplan-current-normalized.xml
        - src: /tmp/neuroplan-desired-raw.xml
          dest: /tmp/neuroplan-desired-normalized.xml
      changed_when: false

    - name: Compare normalized Jenkins configs
      ansible.builtin.command:
        cmd: >
          diff -u
          /tmp/neuroplan-current-normalized.xml
          /tmp/neuroplan-desired-normalized.xml
      register: normalized_diff
      changed_when: false
      failed_when: normalized_diff.rc not in [0, 1]

    - name: Show normalized Jenkins config difference
      ansible.builtin.debug:
        var: normalized_diff.stdout_lines

---
# ============================================================
# DNS Server Role
# Target: Infra VM (192.168.14.62)
# Domain: nplan.local
# ============================================================


# ------------------------------------------------------------
# 1. BIND 패키지 설치
# ------------------------------------------------------------

- name: Install BIND packages
  ansible.builtin.dnf:
    name:
      - bind
      - bind-utils
    state: present


# ------------------------------------------------------------
# 2. named.conf 배포
# ------------------------------------------------------------

- name: Deploy named.conf
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: "0640"
    backup: true
    validate: "/usr/sbin/named-checkconf %s"
  notify: Restart named


# ------------------------------------------------------------
# 3. nplan.local Zone 파일 배포
# ------------------------------------------------------------

- name: Deploy nplan.local zone file
  ansible.builtin.template:
    src: nplan.local.zone.j2
    dest: /var/named/nplan.local.zone
    owner: root
    group: named
    mode: "0640"
    backup: true
    validate: "/usr/sbin/named-checkzone nplan.local %s"
  notify: Restart named


# ------------------------------------------------------------
# 4. SELinux Context 복구
# SELinux는 Enforcing 유지
# ------------------------------------------------------------

- name: Restore SELinux context for BIND files
  ansible.builtin.command:
    cmd: restorecon -Rv /var/named
  changed_when: false


# ------------------------------------------------------------
# 5. Management NIC firewalld Zone 확인
# Infra Management NIC = ens160
# 현재 확인값은 nw-mgmt이지만 자동 조회
# ------------------------------------------------------------

- name: Get firewalld zone for Management interface
  ansible.builtin.command:
    cmd: firewall-cmd --get-zone-of-interface=ens160
  register: mgmt_firewall_zone
  changed_when: false

- name: Display Management firewall zone
  ansible.builtin.debug:
    msg: "Management firewalld zone: {{ mgmt_firewall_zone.stdout }}"


# ------------------------------------------------------------
# 6. DNS TCP 53 허용
# ------------------------------------------------------------

- name: Check DNS TCP port in firewalld
  ansible.builtin.command:
    cmd: >
      firewall-cmd
      --zone={{ mgmt_firewall_zone.stdout }}
      --query-port=53/tcp
  register: dns_tcp_rule
  failed_when: dns_tcp_rule.rc not in [0, 1]
  changed_when: false

- name: Open DNS TCP port 53
  ansible.builtin.command:
    cmd: >
      firewall-cmd
      --zone={{ mgmt_firewall_zone.stdout }}
      --permanent
      --add-port=53/tcp
  when: dns_tcp_rule.rc == 1
  notify: Reload firewalld


# ------------------------------------------------------------
# 7. DNS UDP 53 허용
# ------------------------------------------------------------

- name: Check DNS UDP port in firewalld
  ansible.builtin.command:
    cmd: >
      firewall-cmd
      --zone={{ mgmt_firewall_zone.stdout }}
      --query-port=53/udp
  register: dns_udp_rule
  failed_when: dns_udp_rule.rc not in [0, 1]
  changed_when: false

- name: Open DNS UDP port 53
  ansible.builtin.command:
    cmd: >
      firewall-cmd
      --zone={{ mgmt_firewall_zone.stdout }}
      --permanent
      --add-port=53/udp
  when: dns_udp_rule.rc == 1
  notify: Reload firewalld


# ------------------------------------------------------------
# 8. named 서비스 활성화
# ------------------------------------------------------------

- name: Enable and start named service
  ansible.builtin.service:
    name: named
    state: started
    enabled: true


# ------------------------------------------------------------
# 9. Handler 즉시 적용
# ------------------------------------------------------------

- name: Apply pending handlers
  ansible.builtin.meta: flush_handlers


# ------------------------------------------------------------
# 10. BIND 설정 검증
# ------------------------------------------------------------

- name: Validate named.conf
  ansible.builtin.command:
    cmd: named-checkconf /etc/named.conf
  changed_when: false


- name: Validate nplan.local zone
  ansible.builtin.command:
    cmd: named-checkzone nplan.local /var/named/nplan.local.zone
  register: dns_zone_check
  changed_when: false


# ------------------------------------------------------------
# 11. named 서비스 상태 확인
# ------------------------------------------------------------

- name: Check named service status
  ansible.builtin.command:
    cmd: systemctl is-active named
  register: named_status
  changed_when: false
  failed_when: named_status.stdout != "active"


# ------------------------------------------------------------
# 12. 내부 DNS 조회 검증
# devops.nplan.local -> 192.168.14.21
# ------------------------------------------------------------

- name: Test internal DNS resolution
  ansible.builtin.command:
    cmd: dig @192.168.14.62 devops.nplan.local +short
  register: internal_dns_test
  changed_when: false
  failed_when: "'192.168.14.21' not in internal_dns_test.stdout"


# ------------------------------------------------------------
# 13. 외부 DNS Forwarding 검증
# ------------------------------------------------------------

- name: Test external DNS forwarding
  ansible.builtin.command:
    cmd: dig @192.168.14.62 mirrors.centos.org +short
  register: external_dns_test
  changed_when: false
  failed_when: external_dns_test.stdout | trim | length == 0


# ------------------------------------------------------------
# 14. 최종 DNS 상태 출력
# ------------------------------------------------------------

- name: Display DNS validation result
  ansible.builtin.debug:
    msg:
      - "named service: {{ named_status.stdout }}"
      - "Internal DNS devops.nplan.local: {{ internal_dns_test.stdout | trim }}"
      - "External DNS forwarding: OK"
      - "DNS Server: 192.168.14.62"
      - "Domain: nplan.local"

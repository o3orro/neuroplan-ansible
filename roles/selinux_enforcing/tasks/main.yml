---
# ============================================================
# Infra - SELinux Enforcing
# Kubernetes Nodes 제외
# ============================================================

- name: Ensure SELinux enforcing in configuration
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=enforcing'
    backup: true

- name: Get current SELinux mode
  ansible.builtin.command:
    cmd: getenforce
  register: selinux_current
  changed_when: false

- name: Set SELinux to enforcing immediately
  ansible.builtin.command:
    cmd: setenforce 1
  when: selinux_current.stdout == "Permissive"

- name: Verify SELinux mode
  ansible.builtin.command:
    cmd: getenforce
  register: selinux_verify
  changed_when: false

- name: Ensure SELinux is enforcing
  ansible.builtin.assert:
    that:
      - selinux_verify.stdout == "Enforcing"
    fail_msg: >-
      SELinux is {{ selinux_verify.stdout }}.
      If SELinux is Disabled, /etc/selinux/config has been configured
      for Enforcing but a reboot is required.
    success_msg: "SELinux is Enforcing."

---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Get current timezone
  ansible.builtin.command:
    cmd: timedatectl show --property=Timezone --value
  register: current_timezone
  changed_when: false

- name: Set timezone to Asia/Seoul
  ansible.builtin.command:
    cmd: timedatectl set-timezone Asia/Seoul
  when: current_timezone.stdout != "Asia/Seoul"

# ------------------------------------------------------------
# Common Packages
# 설치되어 있으면 Skip / 없으면 Install
# ------------------------------------------------------------

- name: Check installed common packages
  ansible.builtin.command:
    cmd: "rpm -q {{ item }}"
  loop:
    - curl
    - wget
    - git
    - net-tools
    - bind-utils
    - bash-completion
    - rsync
    - tar
  register: common_package_check
  changed_when: false
  failed_when: false

- name: Install missing common packages
  ansible.builtin.dnf:
    name: "{{ item.item }}"
    state: present
  loop: "{{ common_package_check.results }}"
  when: item.rc != 0
  loop_control:
    label: "{{ item.item }}"

# ------------------------------------------------------------
# SSH Service
# ------------------------------------------------------------

- name: Ensure SSH service is enabled and started
  ansible.builtin.systemd_service:
    name: sshd
    enabled: true
    state: started

- name: Verify SSH service
  ansible.builtin.command:
    cmd: systemctl is-active sshd
  register: common_sshd_status
  changed_when: false
  failed_when: common_sshd_status.stdout != "active"

- name: Display SSH service status
  ansible.builtin.debug:
    msg: "SSHD: {{ common_sshd_status.stdout }}"



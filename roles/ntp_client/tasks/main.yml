---
# ============================================================
# InfraReady - NTP Client
# NTP Server: Infra 192.168.14.62
# ============================================================

- name: Install chrony
  ansible.builtin.dnf:
    name: chrony
    state: present

- name: Disable existing chrony pool entries
  ansible.builtin.replace:
    path: /etc/chrony.conf
    regexp: '^(pool\s+.*)$'
    replace: '# \1'
    backup: true
  notify: Restart chronyd

- name: Disable existing chrony server entries
  ansible.builtin.replace:
    path: /etc/chrony.conf
    regexp: '^(server\s+(?!192\.168\.14\.62).*)$'
    replace: '# \1'
    backup: true
  notify: Restart chronyd

- name: Configure Infra NTP server
  ansible.builtin.blockinfile:
    path: /etc/chrony.conf
    marker: "# {mark} INFRAREADY NTP MANAGED BLOCK"
    block: |
      server 192.168.14.62 iburst
  notify: Restart chronyd

- name: Enable and start chronyd
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

- name: Apply chronyd configuration changes
  ansible.builtin.meta: flush_handlers

- name: Check chronyd service
  ansible.builtin.command:
    cmd: systemctl is-active chronyd
  register: chronyd_status
  changed_when: false
  failed_when: chronyd_status.stdout != "active"

- name: Display chronyd status
  ansible.builtin.debug:
    msg: "chronyd service: {{ chronyd_status.stdout }}"

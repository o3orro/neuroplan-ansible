---
# ============================================================
# Infra - DNS Client
# DNS Server : Infra 192.168.14.62
# Search Domain : nplan.local
# ============================================================


# Management Network(192.168.14.0/24)이 붙어 있는 NIC 확인
- name: Find Management interface
  ansible.builtin.shell: |
    ip -4 -o addr show |
    awk '$4 ~ /^192\.168\.14\./ {print $2; exit}'
  register: dns_mgmt_interface
  changed_when: false


- name: Verify Management interface
  ansible.builtin.assert:
    that:
      - dns_mgmt_interface.stdout | trim | length > 0
    fail_msg: "192.168.14.0/24 Management interface를 찾을 수 없습니다."


# 해당 NIC의 NetworkManager Connection 이름 확인
- name: Find Management NetworkManager connection
  ansible.builtin.command:
    cmd: >
      nmcli -g GENERAL.CONNECTION
      device show {{ dns_mgmt_interface.stdout | trim }}
  register: dns_mgmt_connection
  changed_when: false


- name: Display detected Management network
  ansible.builtin.debug:
    msg:
      - "Interface: {{ dns_mgmt_interface.stdout | trim }}"
      - "Connection: {{ dns_mgmt_connection.stdout | trim }}"


# 현재 DNS 확인
- name: Get current DNS servers
  ansible.builtin.command:
    cmd: >
      nmcli -g ipv4.dns
      connection show "{{ dns_mgmt_connection.stdout | trim }}"
  register: current_dns
  changed_when: false


# DNS = Infra
- name: Configure Infra DNS server
  ansible.builtin.command:
    cmd: >
      nmcli connection modify
      "{{ dns_mgmt_connection.stdout | trim }}"
      ipv4.dns "192.168.14.62"
  when: "'192.168.14.62' not in current_dns.stdout"
  notify: Reapply DNS configuration


# 현재 DNS Search 확인
- name: Get current DNS search domain
  ansible.builtin.command:
    cmd: >
      nmcli -g ipv4.dns-search
      connection show "{{ dns_mgmt_connection.stdout | trim }}"
  register: current_dns_search
  changed_when: false


# Search Domain = nplan.local
- name: Configure DNS search domain
  ansible.builtin.command:
    cmd: >
      nmcli connection modify
      "{{ dns_mgmt_connection.stdout | trim }}"
      ipv4.dns-search "nplan.local"
  when: "'nplan.local' not in current_dns_search.stdout"
  notify: Reapply DNS configuration


# DHCP 등에서 들어오는 다른 DNS 차단
- name: Get ignore-auto-dns setting
  ansible.builtin.command:
    cmd: >
      nmcli -g ipv4.ignore-auto-dns
      connection show "{{ dns_mgmt_connection.stdout | trim }}"
  register: current_ignore_auto_dns
  changed_when: false


- name: Disable automatic DNS
  ansible.builtin.command:
    cmd: >
      nmcli connection modify
      "{{ dns_mgmt_connection.stdout | trim }}"
      ipv4.ignore-auto-dns yes
  when: current_ignore_auto_dns.stdout | trim != "yes"
  notify: Reapply DNS configuration


# 변경사항 즉시 적용
- name: Apply pending DNS changes
  ansible.builtin.meta: flush_handlers


# 내부 DNS 검증
- name: Verify internal DNS resolution
  ansible.builtin.command:
    cmd: getent hosts infra.nplan.local
  register: internal_dns_test
  changed_when: false
  failed_when: "'192.168.14.62' not in internal_dns_test.stdout"


# 외부 DNS 검증
- name: Verify external DNS resolution
  ansible.builtin.command:
    cmd: getent hosts mirrors.centos.org
  register: external_dns_test
  changed_when: false


- name: Display DNS validation
  ansible.builtin.debug:
    msg:
      - "DNS Server: 192.168.14.62"
      - "Search Domain: nplan.local"
      - "Internal DNS: OK"
      - "External DNS: OK"

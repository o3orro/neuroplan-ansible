---
- name: Install HAProxy
  ansible.builtin.dnf:
    name: haproxy
    state: present

- name: Configure ip_nonlocal_bind
  ansible.builtin.copy:
    content: "net.ipv4.ip_nonlocal_bind = 1\n"
    dest: /etc/sysctl.d/99-haproxy.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: "/usr/sbin/haproxy -c -f %s"
  notify: Restart haproxy

- name: Enable and start HAProxy
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
